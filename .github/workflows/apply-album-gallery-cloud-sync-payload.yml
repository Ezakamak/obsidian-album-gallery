name: Apply Album Gallery cloud sync payload

on:
  push:
    branches: [agent/obsidian-cloud-sync-v1]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/obsidian-cloud-sync-v1
          fetch-depth: 0
      - name: Restore implementation payload
        run: |
          set -euo pipefail
          cat \
            .github/obsidian-sync-payload/part-00.txt \
            .github/obsidian-sync-payload/part-01a.txt \
            .github/obsidian-sync-payload/part-01b.txt \
            .github/obsidian-sync-payload/part-02.txt \
            .github/obsidian-sync-payload/part-03.txt \
            .github/obsidian-sync-payload/part-04.txt \
            > /tmp/album-gallery-cloud-sync.b64
          base64 -d /tmp/album-gallery-cloud-sync.b64 > /tmp/album-gallery-cloud-sync.tgz
          echo 'd9bb9f3dae6c09d526946c6c6d8d5cd729cb82ec5d590af9923fb3ef8f9999ff  /tmp/album-gallery-cloud-sync.tgz' | sha256sum -c -
          tar -xzf /tmp/album-gallery-cloud-sync.tgz -C .
          rm -rf .github/obsidian-sync-payload
          rm -f .github/workflows/export-obsidian-sync-context.yml
          rm -f .github/workflows/apply-album-gallery-cloud-sync-payload.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and build plugin 0.5.0
        run: |
          npm ci
          npm run lint
          npm run build
          test "$(node -p "require('./manifest.json').version")" = '0.5.0'
          grep -q '/api/study/obsidian/mistakes' src/main.ts
          grep -q '/api/study/obsidian/mistakes' main.js
          grep -q 'album-gallery-auth' src/main.ts
          grep -q 'album-gallery-auth' main.js
          ! grep -R -q 'navigator.share\|ekastudyconnect\|ekastudyimport' src main.js
          test -f .github/workflows/album-gallery-cloud-sync-validation.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automatic Study Hata Defteri cloud sync [skip ci]'
          git push origin HEAD:agent/obsidian-cloud-sync-v1
