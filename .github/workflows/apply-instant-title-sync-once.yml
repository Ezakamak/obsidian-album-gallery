name: Apply instant gallery title sync once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/apply-instant-title-sync-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out title-sync branch
        uses: actions/checkout@v4
        with:
          ref: fix/instant-gallery-title-sync-0.6.11
          fetch-depth: 0

      - name: Apply instant title synchronization
        run: python3 scripts/apply-instant-title-sync-once.py

      - name: Remove one-time repair files
        run: |
          rm -f scripts/apply-instant-title-sync-once.py
          rm -f .github/workflows/apply-instant-title-sync-once.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete zero-warning release validation
        run: npm run prepare:release

      - name: Verify instant title-sync contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.6.11"
          test "$(node -p "require('./package.json').version")" = "0.6.11"
          test "$(node -p "require('./package-lock.json').version")" = "0.6.11"
          test "$(node -p "require('./versions.json')['0.6.11']")" = "1.13.0"
          grep -q "private syncTitleWithFileName(): boolean" src/gallery-view.ts
          grep -q "const titleChanged = this.syncTitleWithFileName();" src/gallery-view.ts
          grep -q "if (titleChanged) this.requestSave();" src/gallery-view.ts
          node scripts/validate-title-sync.mjs
          node --check main.js

      - name: Commit validated 0.6.11 source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize gallery title immediately after file rename"
          git push origin HEAD:fix/instant-gallery-title-sync-0.6.11
