name: Apply complete Obsidian warning cleanup once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/apply-warning-cleanup-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out warning-cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/clean-all-review-warnings-0.6.10
          fetch-depth: 0

      - name: Apply source-level warning fixes
        run: python3 scripts/apply-warning-cleanup-once.py

      - name: Correct lint scopes for shipped code and build tooling
        shell: bash
        run: |
          cat > eslint.config.mjs <<'EOF'
          import obsidianmd from 'eslint-plugin-obsidianmd';
          import globals from 'globals';
          import { defineConfig, globalIgnores } from 'eslint/config';

          export default defineConfig(
            globalIgnores([
              'node_modules/**',
              'release/**',
              'dist/**',
              'build/**',
              'coverage/**',
              'main.js',
              'package-lock.json',
            ]),
            {
              languageOptions: {
                globals: {
                  ...globals.browser,
                  ...globals.node,
                },
                parserOptions: {
                  projectService: {
                    allowDefaultProject: [
                      'eslint.config.mjs',
                      'eslint.config.mts',
                      'esbuild.config.mjs',
                      'version-bump.mjs',
                      'scripts/*.mjs',
                      'manifest.json',
                    ],
                  },
                  tsconfigRootDir: import.meta.dirname,
                  extraFileExtensions: ['.json'],
                },
              },
            },
            ...obsidianmd.configs.recommended,
            {
              files: ['scripts/**/*.mjs', '*.mjs'],
              rules: {
                'obsidianmd/no-nodejs-modules': 'off',
                'obsidianmd/rule-custom-message': 'off',
                'no-console': 'off',
              },
            },
            {
              files: ['src/**/*.ts'],
              rules: {
                '@typescript-eslint/no-unused-vars': ['error', {
                  argsIgnorePattern: '^_',
                  varsIgnorePattern: '^_',
                }],
              },
            },
          );
          EOF
          git checkout HEAD -- scripts/prepare-release.mjs

      - name: Remove one-time repair files
        run: |
          rm -f scripts/apply-warning-cleanup-once.py
          rm -f .github/workflows/apply-warning-cleanup-once.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Regenerate exact dependency lockfile
        run: npm install --package-lock=true

      - name: Run zero-warning lint and complete release validation
        run: npm run prepare:release

      - name: Verify Obsidian review warning contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.6.10"
          test "$(node -p "require('./manifest.json').minAppVersion")" = "1.13.0"
          test -s package-lock.json
          ! grep -R -n --include='*.ts' --include='*.js' "document.createElement" src main.js
          ! grep -R -n --include='*.ts' "instanceof HTMLVideoElement" src
          ! grep -n "!important" styles.css
          ! grep -R -n "eslint-disable\|ts-ignore\|ts-nocheck" src
          grep -q "getSettingDefinitions" src/settings.ts
          ! grep -q "display(): void" src/settings.ts
          node --check main.js

      - name: Commit validated 0.6.10 source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean all Obsidian automated-review warnings"
          git push origin HEAD:fix/clean-all-review-warnings-0.6.10
