name: Export warning audit source once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/export-warning-audit-source-once.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot
        run: |
          set -euo pipefail
          tar -czf album-gallery-source-audit.tar.gz \
            src scripts \
            package.json tsconfig.json eslint.config.mjs esbuild.config.mjs \
            manifest.json versions.json styles.css CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: album-gallery-source-audit
          path: album-gallery-source-audit.tar.gz
          if-no-files-found: error
          retention-days: 1
