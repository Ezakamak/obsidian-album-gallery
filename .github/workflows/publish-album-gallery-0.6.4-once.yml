name: Publish Album Gallery 0.6.4 once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-album-gallery-0.6.4-once.yml

permissions:
  contents: write

concurrency:
  group: publish-album-gallery-0.6.4
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.6.4
  RELEASE_TARGET: bb6dbbe6e366d717080d44111516352a6b890ac5

jobs:
  publish:
    name: Validate and publish 0.6.4
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and prepare release assets
        run: npm run prepare:release

      - name: Verify release metadata and files
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          test "$actual_version" = "$RELEASE_VERSION"
          test -s "release/$RELEASE_VERSION/main.js"
          test -s "release/$RELEASE_VERSION/manifest.json"
          test -s "release/$RELEASE_VERSION/styles.css"
          test -s "release/$RELEASE_VERSION/release-manifest.json"

      - name: Create or repair the GitHub release
        id: publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<'NOTES'
          Album Gallery 0.6.4 prepares the plugin for Obsidian Community Plugins review.

          Highlights:
          - Photos, animated GIFs, MP4, MOV, and WebM support in normal albums
          - Visible iOS video preview frames and safer iPhone lightbox controls
          - Optional Ekatech Study account manager and Hata Defteri synchronization
          - Hata Defteri remains strictly photo-only; GIFs and videos are rejected
          - Updated privacy, security, release, and installation documentation

          Release assets are provided separately as required by Obsidian: `main.js`, `manifest.json`, and `styles.css`.
          NOTES

          assets=(
            "release/$RELEASE_VERSION/main.js"
            "release/$RELEASE_VERSION/manifest.json"
            "release/$RELEASE_VERSION/styles.css"
          )

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" \
              --title "Album Gallery $RELEASE_VERSION" \
              --notes-file /tmp/release-notes.md \
              --draft=false \
              --prerelease=false
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_VERSION" "${assets[@]}" \
              --target "$RELEASE_TARGET" \
              --title "Album Gallery $RELEASE_VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

          python3 - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ["RELEASE_VERSION"]
          data = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "release",
                      "view",
                      version,
                      "--json",
                      "tagName,isDraft,isPrerelease,assets,targetCommitish",
                  ],
                  text=True,
              )
          )
          expected = {"main.js", "manifest.json", "styles.css"}
          actual = {asset["name"] for asset in data["assets"]}
          assert data["tagName"] == version, data
          assert data["isDraft"] is False, data
          assert data["isPrerelease"] is False, data
          assert expected.issubset(actual), (expected, actual)
          print(json.dumps(data, indent=2))
          PY

      - name: Remove the one-time publisher
        if: steps.publish_release.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          rm -f .github/workflows/publish-album-gallery-0.6.4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/publish-album-gallery-0.6.4-once.yml
          git commit -m "Remove one-time Album Gallery 0.6.4 publisher [skip ci]"
          git push origin HEAD:master
