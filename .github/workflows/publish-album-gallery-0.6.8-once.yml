name: Publish Album Gallery 0.6.8 once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-album-gallery-0.6.8-once.yml

permissions:
  contents: write

concurrency:
  group: publish-album-gallery-0.6.8
  cancel-in-progress: false

env:
  RELEASE_VERSION: 0.6.8
  RELEASE_TARGET: fe2659ab664af9dcb670c28fff7f14273e1c4ead

jobs:
  publish:
    name: Validate and publish 0.6.8
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
          fetch-depth: 0

      - name: Verify release source and assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "$RELEASE_VERSION"
          test -s main.js
          test -s manifest.json
          test -s styles.css
          node --check main.js
          grep -q "album-gallery-lightbox-container" main.js
          grep -q "modal-close-button" main.js
          grep -q "album-gallery-lightbox-close" main.js
          grep -q 'repeat(2, minmax(0, 1fr))' styles.css

      - name: Create or repair GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > /tmp/release-notes.md <<'NOTES'
          Album Gallery 0.6.8 is the release prepared for Obsidian Community Plugins submission.

          Highlights:
          - Apple Photos-inspired managed albums for Obsidian
          - Photos, animated GIFs, MP4, MOV, and WebM videos in normal albums
          - Corrected two-column square media grid on Obsidian Mobile
          - Restored mobile lightbox title, counter, and left/right navigation layout
          - Removed Obsidian's native status-bar close control from the lightbox DOM
          - Added an Album Gallery-owned toolbar close button
          - Optional Ekatech Study integration with photo-only Hata Defteri behavior

          Obsidian release assets are attached separately as `main.js`, `manifest.json`, and `styles.css`.
          NOTES

          assets=(main.js manifest.json styles.css)

          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELEASE_VERSION" \
              --title "Album Gallery $RELEASE_VERSION" \
              --notes-file /tmp/release-notes.md \
              --draft=false \
              --prerelease=false \
              --latest
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_VERSION" "${assets[@]}" \
              --target "$RELEASE_TARGET" \
              --title "Album Gallery $RELEASE_VERSION" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

          python3 - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ['RELEASE_VERSION']
          data = json.loads(subprocess.check_output([
              'gh', 'release', 'view', version,
              '--json', 'tagName,isDraft,isPrerelease,assets,targetCommitish,url'
          ], text=True))
          expected = {'main.js', 'manifest.json', 'styles.css'}
          actual = {asset['name'] for asset in data['assets']}
          assert data['tagName'] == version, data
          assert data['isDraft'] is False, data
          assert data['isPrerelease'] is False, data
          assert expected.issubset(actual), (expected, actual)
          print(json.dumps(data, indent=2))
          PY

      - name: Remove one-time publisher
        if: steps.release.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          rm -f .github/workflows/publish-album-gallery-0.6.8-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/publish-album-gallery-0.6.8-once.yml
          git commit -m "Remove one-time Album Gallery 0.6.8 publisher [skip ci]"
          git push origin HEAD:master
