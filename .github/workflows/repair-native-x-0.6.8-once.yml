name: Repair Album Gallery native modal X 0.6.8 once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/repair-native-x-0.6.8-once.yml
      - scripts/apply-native-x-removal-0.6.8.mjs

permissions:
  contents: write

concurrency:
  group: repair-album-gallery-native-x-0.6.8
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-native-x-0.6.8
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Apply native modal X removal
        run: node scripts/apply-native-x-removal-0.6.8.mjs

      - name: Remove one-time repair files
        run: |
          rm -f scripts/apply-native-x-removal-0.6.8.mjs
          rm -f .github/workflows/repair-native-x-0.6.8-once.yml

      - name: Install exact development dependencies
        run: npm install --package-lock=false

      - name: Run complete validation and production build
        run: npm run check

      - name: Verify DOM removal, toolbar close, grid, version, and bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.6.8"
          grep -q "album-gallery-lightbox-container" src/media-support.ts
          grep -q "querySelectorAll<HTMLElement>('.modal-close-button')" src/media-support.ts
          grep -q "closeButton.remove()" src/media-support.ts
          grep -q "new MutationObserver" src/media-support.ts
          grep -q "album-gallery-lightbox-close" src/media-support.ts
          grep -q 'repeat(2, minmax(0, 1fr))' styles.css
          node --check main.js

      - name: Commit the validated production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md main.js manifest.json package.json scripts/validate-lightbox.mjs src/media-styles.ts src/media-support.ts versions.json
          git add -u scripts/apply-native-x-removal-0.6.8.mjs .github/workflows/repair-native-x-0.6.8-once.yml
          git commit -m "Remove the native Obsidian lightbox X from the DOM"
          git push origin HEAD:fix/remove-native-x-0.6.8
