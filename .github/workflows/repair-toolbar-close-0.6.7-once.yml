name: Repair Album Gallery toolbar close button 0.6.7 once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/repair-toolbar-close-0.6.7-once.yml
      - scripts/apply-toolbar-close-0.6.7.mjs

permissions:
  contents: write

concurrency:
  group: repair-album-gallery-toolbar-close-0.6.7
  cancel-in-progress: true

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/toolbar-close-button-0.6.7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Apply the toolbar-owned close-button repair
        run: node scripts/apply-toolbar-close-0.6.7.mjs

      - name: Remove one-time repair files before validation
        run: |
          rm -f scripts/apply-toolbar-close-0.6.7.mjs
          rm -f .github/workflows/repair-toolbar-close-0.6.7-once.yml

      - name: Install exact development dependencies
        run: npm install --package-lock=false

      - name: Run complete validation and production build
        run: npm run check

      - name: Verify close control, grid, version, and bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.6.7"
          grep -q "album-gallery-lightbox-close" src/media-support.ts
          grep -q "setIcon(closeButton, 'x')" src/media-support.ts
          grep -q "display: none !important" src/media-styles.ts
          grep -q "padding-top: 72px !important" src/media-styles.ts
          ! grep -A28 -F '.album-gallery-lightbox-modal .modal-close-button {' src/media-styles.ts | grep -q 'position: fixed'
          grep -q 'repeat(2, minmax(0, 1fr))' styles.css
          node --check main.js

      - name: Commit the validated production bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md main.js manifest.json package.json scripts/validate-lightbox.mjs src/media-styles.ts src/media-support.ts versions.json
          git add -u scripts/apply-toolbar-close-0.6.7.mjs .github/workflows/repair-toolbar-close-0.6.7-once.yml
          git commit -m "Use a toolbar-owned mobile lightbox close button"
          git push origin HEAD:fix/toolbar-close-button-0.6.7
