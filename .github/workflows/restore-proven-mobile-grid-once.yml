name: Restore proven Album Gallery mobile grid once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/restore-proven-mobile-grid-once.yml
      - scripts/apply-proven-mobile-grid.mjs
  push:
    branches:
      - fix/restore-proven-mobile-grid-0.6.5
    paths:
      - .github/workflows/restore-proven-mobile-grid-once.yml

permissions:
  contents: write

concurrency:
  group: restore-proven-mobile-grid-0.6.5
  cancel-in-progress: true

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out restoration branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-proven-mobile-grid-0.6.5
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Restore the proven 0.6.2 mobile grid contract
        run: node scripts/apply-proven-mobile-grid.mjs

      - name: Remove one-time restoration files before validation
        run: |
          rm -f scripts/apply-proven-mobile-grid.mjs
          rm -f .github/workflows/restore-proven-mobile-grid-once.yml

      - name: Install exact development dependencies without creating a lockfile
        run: npm install --package-lock=false

      - name: Run full local-style validation and production build
        run: npm run check

      - name: Verify release version and generated bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.6.5"
          test "$(node -p "require('./package.json').version")" = "0.6.5"
          grep -q '0.6.5' main.js
          node --check main.js
          node scripts/validate-mobile-grid.mjs
          git diff --check

      - name: Commit the validated restoration to the branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore proven two-column mobile grid and release 0.6.5 [skip ci]"
          git push origin HEAD:fix/restore-proven-mobile-grid-0.6.5
