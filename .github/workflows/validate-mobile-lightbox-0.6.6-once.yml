name: Validate Album Gallery mobile lightbox 0.6.6 once

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/validate-mobile-lightbox-0.6.6-once.yml
      - src/media-styles.ts
      - scripts/validate-lightbox.mjs
      - package.json
      - manifest.json
      - versions.json
      - CHANGELOG.md

permissions:
  contents: write

concurrency:
  group: validate-mobile-lightbox-0.6.6
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the lightbox fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-mobile-lightbox-0.6.6
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install exact development dependencies
        run: npm install --package-lock=false

      - name: Run complete validation and production build
        run: npm run check

      - name: Verify mobile grid, lightbox, version, and bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "0.6.6"
          test "$(node -p "require('./package.json').version")" = "0.6.6"
          node scripts/validate-mobile-grid.mjs
          node scripts/validate-lightbox.mjs
          node --check main.js
          grep -q 'Album Gallery 0.6.6' main.js
          grep -q 'album-gallery-lightbox-previous' main.js
          grep -q 'album-gallery-lightbox-next' main.js
          grep -q 'translateY(-50%)' main.js
          git diff --check

      - name: Commit the validated production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-mobile-lightbox-0.6.6-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build validated Album Gallery 0.6.6 mobile lightbox fix [skip ci]"
          git push origin HEAD:fix/restore-mobile-lightbox-0.6.6
