name: Validate Study share handoff

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/share-sheet-study-link
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set plugin version
        run: |
          if [ "$(node -p "require('./package.json').version")" != "0.4.0" ]; then
            npm version 0.4.0 --no-git-tag-version
          fi
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = '0.4.0';
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          versions['0.4.0'] = manifest.minAppVersion;
          fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
          NODE

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify sandbox-safe transport
        run: |
          grep -q "navigator.share" src/main.ts
          grep -q "ekastudyconnect" src/ekatech-study.ts
          grep -q "application/vnd.ekatech.study-link+json" src/ekatech-study.ts
          grep -q "navigator.share" main.js
          grep -q "ekastudyconnect" main.js
          if grep -q "didLeaveObsidian" src/main.ts; then
            echo "Legacy visibility timeout remains"
            exit 1
          fi

      - name: Commit validated release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js manifest.json package.json package-lock.json versions.json
          if git diff --cached --quiet; then
            echo 'Generated files already current'
          else
            git commit -m "Build Album Gallery 0.4.0 [skip ci]"
            git push origin HEAD:agent/share-sheet-study-link
          fi
